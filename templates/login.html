{% extends "base.html" %}
{% block title %}Login — LifeOS AI{% endblock %}
{% block public_content %}
<div class="auth-page">
  <div class="auth-card">
    <a class="brand centered" href="{{ url_for('index') }}">🧠 LifeOS <b>AI</b></a>
    <h2>Welcome back</h2>
    <p>Sign in to your personal intelligence system.</p>
    <form method="post">
      <label>Email</label><input name="email" type="email" required>
      <label>Password</label><input name="password" type="password" required>
      <button class="btn primary full">Sign in</button>
    </form>
    <p class="small">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
